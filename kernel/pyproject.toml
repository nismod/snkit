[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "snkit-kernel"
version = "0.1.0"
description = "Compiled array kernel for snkit"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.maturin]
features = ["python"]
module-name = "snkit_kernel"
