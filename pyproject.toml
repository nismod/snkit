[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "snkit"
dynamic = ["version"]
description = "a spatial networks toolkit"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tom Russell", email = "tomalrussell@gmail.com" }]
keywords = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = ["geopandas>=1.0", "numpy", "pandas", "shapely>=2.0"]

[project.optional-dependencies]
arrow = ["pyarrow>=14"]
dev = ["mypy", "nbstripout", "pre-commit", "pyarrow>=14", "pytest", "pytest-cov", "ruff"]
docs = ["myst-parser", "sphinx"]
networkx = ["networkx>=3.0"]
igraph = ["python-igraph>=1.0"]

[project.urls]
Homepage = "https://snkit.readthedocs.io/en/latest/"
Source = "https://github.com/tomalrussell/snkit"

[tool.maturin]
# the kernel is a Rust crate in kernel/, built into the package as snkit._native;
# the package version is the version of that crate
manifest-path = "kernel/Cargo.toml"
python-source = "src"
module-name = "snkit._native"
features = ["python"]

[tool.pytest.ini_options]
addopts = "--cov=snkit --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["src/snkit/_version.py"]

[tool.ruff]
src = ["src"]
line-length = 120

[tool.mypy]
exclude = ['venv', '.venv', 'build', 'docs', 'tests']

[[tool.mypy.overrides]]
module = ["geopandas", "igraph", "networkx", "numpy", "scipy.*", "shapely.*"]
ignore_missing_imports = true
